name: tests

# Runs on every pull request and on every push to main.
# The shipped app is standard-library only; pytest is a dev-only dependency (requirements-dev.txt).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # the version the Docker image / runtime.txt use
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools (dev only)
        run: python -m pip install -r requirements-dev.txt
      - name: Compile (catches syntax errors)
        run: python -m py_compile kelp_erp_server.py
      - name: Tests (real server on a throwaway database)
        run: python -m pytest
